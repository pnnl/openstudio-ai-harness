$schema: asset_manifest.schema.json
version: 1
assets:
  - path: prompts/openstudio_agent.md
    kind: agent_prompt
    labels:
      - prompt
      - agent
      - orchestration
    hosts:
      claude:
        copy: false
        generated_target: agents/openstudio-modeler.md
        role: agent_template
      codex:
        role: skill_reference
        targets:
          - skills/openstudio-modeling-orchestrator/references/openstudio_agent.md

  - path: prompts/harness_system_prompt.md
    kind: orchestration_prompt
    labels:
      - prompt
      - orchestration
