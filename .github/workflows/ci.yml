name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Production tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser test dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run full test suite (including slow checks)
        env:
          OPENSTUDIO_AI_DATA_DIR: ${{ runner.temp }}/openstudio-ai-tests
        run: python -m pytest -q tests --strict-markers --durations=25 --junitxml=test-results/full.xml

      - name: Upload full test timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results-python-${{ matrix.python-version }}
          path: test-results/full.xml
          if-no-files-found: warn

  standalone:
    name: Standalone tests (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: standalone/uv.lock

      - name: Install standalone dependencies
        run: uv sync --project standalone --locked

      - name: Run standalone tests
        run: uv run --project standalone python -m pytest -q standalone/tests
