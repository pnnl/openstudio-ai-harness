$schema: asset_manifest.schema.json
version: 2
assets:
  - path: prompts/openstudio_agent.md
    agent:
      hosts: [claude]
      name: openstudio-modeler
    references:
      - hosts: [codex]
        skill: openstudio-modeling-orchestrator

  - path: prompts/blackboard_contract.md
    references:
      - hosts: [claude, codex]
        skill: openstudio-workflow-state

  - path: prompts/learning_contract.md
    references:
      - hosts: [claude, codex]
        skill: propose-measure
      - hosts: [claude, codex]
        skill: capture-session-lesson

  - path: prompts/promotion_rules.md
    references:
      - hosts: [claude, codex]
        skill: propose-measure

  - path: knowledge/openstudio_sdk_recipes.md
    references:
      - hosts: [claude, codex]
        skill: openstudio-sdk-model-editor

  - path: knowledge/openstudio_sdk_wiki/*.md
    references:
      - hosts: [claude, codex]
        skill: openstudio-sdk-model-editor
        subdirectory: sdk_wiki

  - path: blackboard/schemas/workflow_state.schema.json
    references:
      - hosts: [claude, codex]
        skill: openstudio-workflow-state

  - path: blackboard/schemas/state_patch.schema.json
    references:
      - hosts: [claude, codex]
        skill: openstudio-workflow-state

  - path: learning/harness_pipeline/schemas/candidate_measure.schema.json
    references:
      - hosts: [claude, codex]
        skill: propose-measure

  - path: learning/harness_pipeline/schemas/candidate_recipe.schema.json
    references:
      - hosts: [claude, codex]
        skill: propose-measure

  - path: learning/harness_pipeline/schemas/session_lesson.schema.json
    references:
      - hosts: [claude, codex]
        skill: capture-session-lesson

  - path: learning/harness_pipeline/runtime_learning.md
    references:
      - hosts: [claude, codex]
        skill: capture-session-lesson
