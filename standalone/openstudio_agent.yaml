spec_version: v1

agent:
  name: OpenStudio AI Model Workspace Agent
  description: Local OpenStudio AI agent wired to MCP tools and bounded OpenStudio SDK model editing.
  version: 0.4.0

instructions:
  path: ../prompts/openstudio_agent.md

model:
  provider: claude
  name: claude-opus-4-8-project
  base_url: https://ai-incubator-api.pnnl.gov
  api_key: ${OSSTD_LLM_API}

runtime:
  agent_type: langgraph-chat
  debug: true

telemetry:
  enabled: true
  recorder: jsonl
  path: ../logs/telemetry.jsonl
  content_mode: metadata
  load_plugins: false

tools:
  tools:
    - type: run_python
      config:
        runner: local_subprocess
        python_executable: python
        timeout_s: 120
        workspace_root: ..
        max_artifacts: 20
        warn_script_lines: 120
        failure_experience_path: ../logs/python_script_failure_experience.jsonl
        allow_network: false
        blocked_imports:
          - subprocess
          - socket
          - requests
          - urllib
          - ctypes

skills:
  enabled: true
  allowed_roots:
    - ../skills
    - ../knowledge/openstudio_sdk_wiki
  registry:
    openstudio_skills:
      path: ../skills
      mode: directory
    # Retain the public skill name used throughout the existing prompt and
    # parent VAV workflow; the file's stem is also available via the directory.
    openstudio_workflow_state:
      path: ../skills/openstudio_hvac_workflow_state.md
    openstudio_sdk_wiki:
      path: ../knowledge/openstudio_sdk_wiki
      mode: directory

mcp:
  servers:
    openstudio_ai_mcp:
      name: openstudio_ai_mcp
      host: 127.0.0.1
      port: 10210
      transport: sse
