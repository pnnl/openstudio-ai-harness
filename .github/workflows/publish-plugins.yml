name: Publish plugins marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-plugins
  cancel-in-progress: false

env:
  PLUGINS_REPO: pnnl-int/openstudio-ai-plugins
  EXPORT_BRANCH: automated/plugin-export
  EXPORT_COMMAND: openstudio-ai export marketplace --runtime-mode marketplace

jobs:
  export:
    name: Export marketplace and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out harness
        uses: actions/checkout@v4
        with:
          path: harness-repo

      - name: Check out plugins repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGINS_REPO }}
          token: ${{ secrets.PLUGINS_PR_TOKEN }}
          path: plugins-repo

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: harness-repo/uv.lock

      - name: Export marketplace tree
        working-directory: harness-repo
        run: |
          # Unquoted on purpose: EXPORT_COMMAND must word-split into arguments.
          uv run --frozen ${EXPORT_COMMAND} \
            --output-dir "${RUNNER_TEMP}/marketplace" \
            --force

      - name: Sync generated files into plugins checkout
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/marketplace"

          for dir in openstudio-ai plugins .claude-plugin .agents; do
            rsync -a --delete "${src}/${dir}/" "plugins-repo/${dir}/"
          done

          cp "${src}/README.md" "${src}/INSTALL.claude.md" \
             "${src}/INSTALL.codex.md" "${src}/.generated.json" plugins-repo/

      - name: Commit and push export branch
        working-directory: plugins-repo
        env:
          HARNESS_SHA: ${{ github.sha }}
          HARNESS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${EXPORT_BRANCH}"
          git add -A
          git diff --cached --stat
          git commit --allow-empty -F - <<EOF
          chore: re-export marketplace from ${HARNESS_REPO}@${HARNESS_SHA:0:7}

          Generated by: ${EXPORT_COMMAND}
          EOF
          git push --force origin "${EXPORT_BRANCH}"

      - name: Open or update pull request
        working-directory: plugins-repo
        env:
          GH_TOKEN: ${{ secrets.PLUGINS_PR_TOKEN }}
          HARNESS_SHA: ${{ github.sha }}
          HARNESS_REPO: ${{ github.repository }}
          HARNESS_SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Automated re-export of the plugin marketplace tree. Do not edit these files manually.

          - Harness commit: ${HARNESS_SERVER}/${HARNESS_REPO}/commit/${HARNESS_SHA}
          - Command: \`${EXPORT_COMMAND}\`
          EOF
          )
          # Reuse the commit subject so the PR title can never drift from it.
          title=$(git log -1 --format=%s)

          existing=$(gh pr list --head "${EXPORT_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
            echo "Updated PR #${existing}"
          else
            gh pr create \
              --base main \
              --head "${EXPORT_BRANCH}" \
              --title "${title}" \
              --body "${body}"
          fi
