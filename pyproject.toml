[project]
name = "openstudio-ai-harness"
version = "0.1.0"
description = "OpenStudio AI harness with MCP runtime, host adapters, skills, and knowledge."
requires-python = ">=3.12"
authors = [{ name = "PNNL" }]
readme = "README.md"
dependencies = [
    "automa-ai>=0.7.3",
    "mcp>=1.0.0",
    "pydantic>=2.12.3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.9.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
ui = ["streamlit>=1.54.0"]
openstudio = ["openstudio>=3.10.0"]

[project.scripts]
openstudio-ai-mcp = "openstudio_mcp.server:main"
openstudio-ai-claude-export = "adapters.claude_code_adapter:main"
openstudio-ai-codex-export = "adapters.codex_adapter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "blackboard",
    "harness",
    "learning",
    "openstudio_mcp",
    "scripts",
    "sdk_index",
]
include = ["**"]

[tool.hatch.build.targets.sdist]
include = [
    "**",
    "tests/**",
    "README.md",
    "pyproject.toml",
]
